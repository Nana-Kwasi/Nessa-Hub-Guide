<body>
  <header class="bar">
    <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Open chapters"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    <a class="brand" href="#/" aria-label="NessaHub Guide home">

      <span class="tag">Guide</span>

      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"/></svg>
      <span>Search everything…</span>
      <kbd id="kbd-hint">Ctrl K</kbd>
    </button>
    <button class="icon-btn" id="theme-btn" type="button" aria-label="Toggle theme"></button>

  <div class="layout home" id="layout">
    <nav class="side" id="side" aria-label="Chapters"></nav>
    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <footer class="foot">

      <span>© <span id="year"></span> NessaHub · Made in Accra, Ghana</span>

        <input id="palette-input" type="search" autocomplete="off" spellcheck="false" placeholder="Search features, dashboards, policies…" aria-label="Search" aria-controls="palette-results" />

      <div class="palette-results" id="palette-results" role="listbox"></div>
      <div class="p-foot"><span><kbd>↑</kbd><kbd>↓</kbd> to move</span><span><kbd>Enter</kbd> to open</span><span><kbd>Esc</kbd> to close</span></div>
    </div>
  </div>
